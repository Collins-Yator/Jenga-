<header class="site-header">
  <div class="container nav-container">
    <!-- Zone 1: Brand Wordmark -->
    <a href="{% url 'core:home' %}" class="brand-logo" aria-label="Jenga Construction Limited Home">
      <span class="brand-accent-box">J</span>
      <span>JENGA <span style="color: var(--color-construction-yellow);">CONSTRUCTION</span></span>
    </a>

    <!-- Zone 2: Navigation Links -->
    <nav class="nav-links" aria-label="Main Navigation">
      <a href="{% url 'core:home' %}" class="nav-link">Home</a>
      <a href="{% url 'core:about' %}" class="nav-link">About Us</a>
      <a href="{% url 'services:service_list' %}" class="nav-link">Services</a>
      <a href="{% url 'projects:project_list' %}" class="nav-link">Projects</a>
      <a href="{% url 'enquiries:testimonials' %}" class="nav-link">Testimonials</a>
      <a href="{% url 'core:contact' %}" class="nav-link">Contact</a>
    </nav>

    <!-- Zone 3: 1 Primary Action CTA & Mobile Trigger -->
    <div class="nav-cta-group">
      <a href="{% url 'enquiries:quote_request' %}" class="btn btn-primary">
        Request a Quote
      </a>
      <button
        id="mobileNavToggle"
        type="button"
        class="btn btn-dark"
        style="padding: 0.5rem 0.75rem; display: inline-flex;"
        aria-label="Toggle Navigation Menu"
        aria-expanded="false"
      >
        <span style="font-size: 1.25rem; line-height: 1;">&#9776;</span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  <div id="mobileNavMenu" class="hidden" style="background-color: var(--color-charcoal); border-top: 1px solid rgba(255,255,255,0.1); padding: 1.25rem;">
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <a href="{% url 'core:home' %}" style="color: #FFFFFF; font-weight: 600;">Home</a>
      <a href="{% url 'core:about' %}" style="color: #FFFFFF; font-weight: 600;">About Us</a>
      <a href="{% url 'services:service_list' %}" style="color: #FFFFFF; font-weight: 600;">Services</a>
      <a href="{% url 'projects:project_list' %}" style="color: #FFFFFF; font-weight: 600;">Projects</a>
      <a href="{% url 'enquiries:testimonials' %}" style="color: #FFFFFF; font-weight: 600;">Testimonials</a>
      <a href="{% url 'core:contact' %}" style="color: #FFFFFF; font-weight: 600;">Contact</a>
      <a href="https://wa.me/{{ company_whatsapp_number }}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp" style="margin-top: 0.5rem;">
        Chat on WhatsApp ({{ site_settings.local_whatsapp_display|default:'0792729492' }})
      </a>
    </div>
  </div>
</header>
